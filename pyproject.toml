[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "raspimedia"
version = "1.0.0"
description = "High-performance, read-only media library and player controller for Raspberry Pi and Linux"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "RaspiMedia Contributors" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "mutagen>=1.47.0",
    "pydantic>=2.6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0"
]

[project.scripts]
raspimedia = "raspimedia.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["raspimedia*"]
